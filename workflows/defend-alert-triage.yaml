name: Defend Alert Triage
description: >
  Triggered by any Elastic Defend alert. Sends the alert to an Agent Builder
  agent to identify the likely vulnerability, generates an osquery to check
  for that vulnerability across the fleet, validates the query on the source
  host first, then runs it fleet-wide, produces a report, indexes it, and
  sends a Slack notification.

triggers:
  - type: alert

consts:
  # --- Update these for your environment ---
  agent_id: "security-analyst"           # Agent Builder agent ID (created by deploy-workflow.sh)
  agent_policy_id: "REPLACE_ME"          # Fleet agent policy covering monitored hosts
  slack_webhook: "https://hooks.slack.com/services/REPLACE_ME"
  reports_index: "siem-demo-reports"

# ==========================================================================
# STEP 1: Log the incoming alert
# ==========================================================================
steps:
  - name: log_alert
    type: console
    with:
      message: >
        Defend alert received.
        Rule: {{ event.alerts[0]['kibana.alert.rule.name'] }}
        Host: {{ event.alerts[0].host.name }}
        Agent: {{ event.alerts[0].agent.id }}

  # ==========================================================================
  # STEP 2: Agent Builder — Analyze the alert and identify the vulnerability
  # ==========================================================================
  - name: analyze_alert
    type: kibana.request
    with:
      method: POST
      path: /api/agent_builder/converse
      headers:
        kbn-xsrf: "true"
      body:
        agent_id: "{{ consts.agent_id }}"
        input: |
          An endpoint detection alert fired on a host in our environment.
          Analyze the alert data below and determine:

          1. What vulnerability was most likely exploited?
          2. What CVE is it associated with?
          3. What software component is affected?
          4. What versions are vulnerable?
          5. What would you look for on disk to confirm a host is vulnerable?

          Provide a concise analysis (3-5 sentences), then state the CVE ID
          and affected software clearly.

          Alert data:
          {{ event.alerts[0] | json }}
    timeout: 5m

  - name: log_analysis
    type: console
    with:
      message: >
        AI analysis complete:
        {{ steps.analyze_alert.output.response.message }}

  # ==========================================================================
  # STEP 3: Agent Builder — Generate an osquery to detect the vulnerability
  # ==========================================================================
  - name: generate_osquery
    type: kibana.request
    with:
      method: POST
      path: /api/agent_builder/converse
      headers:
        kbn-xsrf: "true"
      body:
        agent_id: "{{ consts.agent_id }}"
        input: |
          Based on this vulnerability analysis, write an osquery SQL query
          that can detect whether a Linux host is vulnerable.

          Analysis:
          {{ steps.analyze_alert.output.response.message }}

          Requirements:
          - The query must use only standard osquery tables (file, hash,
            process_open_sockets, processes, etc.)
          - It should scan common application directories for vulnerable
            files (JARs, libraries, binaries)
          - Return the file path, filename, and any version info

          IMPORTANT: Return ONLY the raw SQL query. No markdown code fences,
          no explanation, no commentary. Just the SELECT statement.
    timeout: 3m

  # Store the query and strip any accidental markdown fences
  - name: store_query
    type: data.set
    with:
      osquery_sql: >
        {{ steps.generate_osquery.output.response.message
           | replace: "```sql", ""
           | replace: "```", ""
           | strip }}

  - name: log_query
    type: console
    with:
      message: >
        Generated osquery:
        {{ steps.store_query.output.osquery_sql }}

  # ==========================================================================
  # STEP 4: Test the osquery on the source host only
  # ==========================================================================
  - name: test_osquery
    type: kibana.request
    with:
      method: POST
      path: /api/osquery/live_queries
      body:
        query: "{{ steps.store_query.output.osquery_sql }}"
        agent_ids:
          - "{{ event.alerts[0].agent.id }}"
        timeout: 120

  - name: log_test_started
    type: console
    with:
      message: >
        Osquery test submitted (action {{ steps.test_osquery.output.data.id }}).
        Running on source host {{ event.alerts[0].host.name }} only.

  # Wait for the test query to complete
  - name: wait_for_test
    type: wait
    with:
      duration: 30s

  # Fetch test results
  - name: fetch_test_results
    type: kibana.request
    with:
      method: GET
      path: "/api/osquery/live_queries/{{ steps.test_osquery.output.data.id }}"

  - name: log_test_results
    type: console
    with:
      message: >
        Test query status: {{ steps.fetch_test_results.output.data.status }}.
        Rows returned: {{ steps.fetch_test_results.output.data.results | size | default: 0 }}.

  # ==========================================================================
  # STEP 5: Validate test results before proceeding
  # ==========================================================================
  - name: check_test
    type: if
    condition: "${{ steps.fetch_test_results.output.data.status == 'complete' }}"
    steps:
      # Test passed — run fleet-wide
      - name: log_test_passed
        type: console
        with:
          message: "Test query succeeded on source host. Running fleet-wide."

      # ======================================================================
      # STEP 6: Run the osquery across the full fleet
      # ======================================================================
      - name: run_fleet_query
        type: kibana.request
        with:
          method: POST
          path: /api/osquery/live_queries
          body:
            query: "{{ steps.store_query.output.osquery_sql }}"
            agent_policy_ids:
              - "{{ consts.agent_policy_id }}"
            timeout: 300

      - name: log_fleet_started
        type: console
        with:
          message: >
            Fleet-wide osquery submitted (action {{ steps.run_fleet_query.output.data.id }}).
            Waiting for results...

      # Wait for fleet results
      - name: wait_for_fleet
        type: wait
        with:
          duration: 60s

      # Fetch fleet results
      - name: fetch_fleet_results
        type: kibana.request
        with:
          method: GET
          path: "/api/osquery/live_queries/{{ steps.run_fleet_query.output.data.id }}"

      - name: log_fleet_results
        type: console
        with:
          message: >
            Fleet query status: {{ steps.fetch_fleet_results.output.data.status }}.
            Results: {{ steps.fetch_fleet_results.output.data.results | json }}

      # ======================================================================
      # STEP 7: Agent Builder — Produce the final report
      # ======================================================================
      - name: generate_report
        type: kibana.request
        with:
          method: POST
          path: /api/agent_builder/converse
          headers:
            kbn-xsrf: "true"
          body:
            agent_id: "{{ consts.agent_id }}"
            input: |
              You are writing an incident report for a security team.

              An Elastic Defend alert fired on host
              "{{ event.alerts[0].host.name }}". Here is the context:

              VULNERABILITY ANALYSIS:
              {{ steps.analyze_alert.output.response.message }}

              OSQUERY USED:
              {{ steps.store_query.output.osquery_sql }}

              FLEET SCAN RESULTS (all monitored hosts):
              {{ steps.fetch_fleet_results.output.data.results | json }}

              Write a structured incident report with these sections:
              1. EXECUTIVE SUMMARY (2-3 sentences)
              2. ALERT DETAILS (host, rule, timestamp, process info)
              3. VULNERABILITY IDENTIFIED (CVE, affected software, versions)
              4. FLEET IMPACT (which hosts are vulnerable, which are patched)
              5. RECOMMENDED ACTIONS (prioritized list)
              6. OSQUERY USED (include the query for reproducibility)

              Use plain text, no markdown. Be concise and actionable.
        timeout: 5m

      - name: log_report
        type: console
        with:
          message: "Report generated. Indexing and notifying."

      # ======================================================================
      # STEP 8: Index the report to Elasticsearch
      # ======================================================================
      - name: index_report
        type: elasticsearch.request
        with:
          method: POST
          path: "/{{ consts.reports_index }}/_doc"
          body:
            "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
            report_type: "defend_alert_triage"
            alert_id: "{{ event.alerts[0]._id }}"
            alert_rule: "{{ event.alerts[0]['kibana.alert.rule.name'] }}"
            source_host: "{{ event.alerts[0].host.name }}"
            source_agent_id: "{{ event.alerts[0].agent.id }}"
            vulnerability_analysis: "{{ steps.analyze_alert.output.response.message }}"
            osquery_sql: "{{ steps.store_query.output.osquery_sql }}"
            fleet_results: ${{ steps.fetch_fleet_results.output.data.results }}
            report: "{{ steps.generate_report.output.response.message }}"
            execution_id: "{{ execution.id }}"

      - name: log_indexed
        type: console
        with:
          message: >
            Report indexed to {{ consts.reports_index }}.
            Doc ID: {{ steps.index_report.output._id }}

      # ======================================================================
      # STEP 9: Send Slack notification
      # ======================================================================
      - name: notify_slack
        type: http
        with:
          url: "{{ consts.slack_webhook }}"
          method: POST
          headers:
            Content-Type: "application/json"
          body:
            text: |
              *Defend Alert Triage Report*

              *Alert:* {{ event.alerts[0]['kibana.alert.rule.name'] }}
              *Source Host:* {{ event.alerts[0].host.name }}
              *Time:* {{ event.alerts[0]['@timestamp'] }}

              *Vulnerability:*
              {{ steps.analyze_alert.output.response.message | truncate: 500 }}

              *Fleet Scan:*
              {{ steps.fetch_fleet_results.output.data.results | size }} host(s) returned results.

              *Full Report:*
              {{ steps.generate_report.output.response.message | truncate: 2000 }}

              _Report indexed to `{{ consts.reports_index }}` (doc {{ steps.index_report.output._id }})_
              _Workflow execution: {{ execution.id }}_

      - name: log_complete
        type: console
        with:
          message: "Triage complete. Report indexed and Slack notification sent."

    # Test failed — log and notify
    else:
      - name: log_test_failed
        type: console
        with:
          message: >
            Osquery test FAILED on source host (status:
            {{ steps.fetch_test_results.output.data.status }}).
            Aborting fleet-wide scan. Review the generated query manually:
            {{ steps.store_query.output.osquery_sql }}

      - name: notify_failure
        type: http
        with:
          url: "{{ consts.slack_webhook }}"
          method: POST
          headers:
            Content-Type: "application/json"
          body:
            text: |
              *Defend Alert Triage — Query Validation Failed*

              Alert fired on *{{ event.alerts[0].host.name }}* but the
              AI-generated osquery failed validation on the source host.

              *Generated query:*
              ```{{ steps.store_query.output.osquery_sql }}```

              Manual investigation required.
              _Workflow execution: {{ execution.id }}_
