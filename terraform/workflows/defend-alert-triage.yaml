name: Defend Alert Triage
enabled: true
description: >
  Triggered by any Elastic Defend alert. Sends the alert to an Agent Builder
  agent to identify the likely vulnerability, generates an osquery to scan
  the fleet for that vulnerability, produces a report, indexes it, and
  creates an Elastic Security Case. Supports manual execution with JSON
  alert input.

triggers:
  - type: alert

consts:
  # --- Update these for your environment ---
  alert_analyzer_id: "alert-analyzer"    # Agent for CVE/vulnerability analysis
  osquery_generator_id: "osquery-generator"  # Agent for osquery SQL generation
  report_writer_id: "report-writer"    # Agent for incident report generation
  connector_id: "Anthropic-Claude-Opus-4-5"             # Inference connector ID for AI agent steps
  agent_policy_id: "356a60cd-f2b4-48ca-b609-0ee44ccdec4a"          # Fleet agent policy covering monitored hosts
  reports_index: "siem-demo-reports"

steps:
  # ==========================================================================
  # STEP 1: Agent Builder — Analyze the alert and identify the vulnerability
  # ==========================================================================
  - name: analyze_alert
    type: ai.agent
    with:
      agent_id: "{{ consts.alert_analyzer_id }}"
      message: |
        An endpoint detection alert fired on a host in our environment.
        Analyze the alert data below and determine:

        1. What vulnerability was most likely exploited?
        2. What CVE is it associated with?
        3. What software component is affected?
        4. What versions are vulnerable?
        5. What would you look for on disk to confirm a host is vulnerable?

        Provide a concise analysis (3-5 sentences), then state the CVE ID
        and affected software clearly.

        Alert data:
        {{ inputs.alerts[0] | default: event.alerts[0] | json }}
    timeout: 5m

  # ==========================================================================
  # STEP 2: Agent Builder — Generate an osquery to detect the vulnerability
  # ==========================================================================
  - name: generate_osquery
    type: ai.agent
    with:
      agent_id: "{{ consts.osquery_generator_id }}"
      message: |
        Based on this vulnerability analysis, write an osquery SQL query
        that can detect whether a Linux host is vulnerable.

        Analysis:
        {{ steps.analyze_alert.output }}

        Requirements:
        - The query must use only standard osquery tables (file, hash,
          process_open_sockets, processes, etc.)
        - It should scan common application directories for vulnerable
          files (JARs, libraries, binaries)
        - Return the file path, filename, and any version info

        IMPORTANT: Return ONLY the raw SQL query. No markdown code fences,
        no explanation, no commentary. Just the SELECT statement.
    timeout: 3m

  # ==========================================================================
  # STEP 3: Run the osquery across the full fleet
  # ==========================================================================
  - name: run_fleet_query
    type: kibana.request
    with:
      method: POST
      path: /api/osquery/live_queries
      body:
        query: "{{ steps.generate_osquery.output | remove: '```sql' | remove: '```' | strip }}"
        agent_policy_ids:
          - "{{ consts.agent_policy_id }}"
        timeout: 300

  # Wait for fleet results
  - name: wait_for_fleet
    type: wait
    with:
      duration: 60s

  # Fetch fleet results from ES index
  - name: fetch_fleet_results
    type: elasticsearch.esql.query
    with:
      format: json
      query: >
        FROM logs-osquery_manager.result-default
        | WHERE action_id == "{{ steps.run_fleet_query.output.data.queries[0].action_id }}"
        | KEEP host.name, osquery.path, osquery.filename, osquery.directory, action_id, @timestamp

  # ==========================================================================
  # STEP 4: Agent Builder — Produce the final report
  # ==========================================================================
  - name: generate_report
    type: ai.agent
    with:
      agent_id: "{{ consts.report_writer_id }}"
      message: |
        Write a security incident report using the template in your instructions.

        SOURCE ALERT DATA:
        {{ inputs.alerts[0] | default: event.alerts[0] | json }}

        VULNERABILITY ANALYSIS:
        {{ steps.analyze_alert.output }}

        OSQUERY USED:
        {{ steps.generate_osquery.output | remove: '```sql' | remove: '```' | strip }}

        FLEET SCAN RESULTS (all monitored hosts):
        Columns: {{ steps.fetch_fleet_results.output.columns | json }}
        Values: {{ steps.fetch_fleet_results.output.values | json }}
    timeout: 5m

  # ==========================================================================
  # STEP 5: Index the report to Elasticsearch
  # ==========================================================================
  - name: index_report
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.reports_index }}/_doc"
      body:
        "@timestamp": "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
        report_type: "defend_alert_triage"
        alert_id: "{{ event.alerts[0]._id | default: inputs.alerts[0]._id }}"
        alert_rule: "{{ event.alerts[0]['kibana.alert.rule.name'] | default: inputs.alerts[0]['kibana.alert.rule.name'] }}"
        source_host: "{{ event.alerts[0].host.name | default: inputs.alerts[0].host.name }}"
        source_agent_id: "{{ event.alerts[0].agent.id | default: inputs.alerts[0].agent.id }}"
        vulnerability_analysis: "{{ steps.analyze_alert.output | strip }}"
        osquery_sql: "{{ steps.generate_osquery.output | remove: '```sql' | remove: '```' | strip }}"
        fleet_results: ${{ steps.fetch_fleet_results.output.values }}
        fleet_columns: ${{ steps.fetch_fleet_results.output.columns }}
        report: "{{ steps.generate_report.output | strip }}"
        execution_id: "{{ execution.id }}"

  # ==========================================================================
  # STEP 6: Create an Elastic Security Case from the report
  # ==========================================================================
  - name: create_case
    type: kibana.createCaseDefaultSpace
    with:
      owner: securitySolution
      title: "Defend Alert Triage: {{ event.alerts[0]['kibana.alert.rule.name'] | default: inputs.alerts[0]['kibana.alert.rule.name'] }}"
      description: "{{ steps.generate_report.output | strip }}"
      severity: high
      tags:
        - automated
        - defend-alert-triage
        - workflow
