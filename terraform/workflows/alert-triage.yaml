name: SIEM Alert Triage
enabled: true
description: >
  Triggered by connected Elastic SIEM rules. Sends the alert to an 
  Agent to identify the likely vulnerability, generates an osquery to scan
  the other hosts for that vulnerability, produces a report, it and
  creates an Elastic Security Case. 


triggers:
  - type: alert

consts:
  alert_analyzer_id: "alert-analyzer"    # Agent for CVE/vulnerability analysis
  osquery_generator_id: "osquery-generator"  # Agent for osquery SQL generation
  report_writer_id: "report-writer"    # Agent for incident report generation
  connector_id: ""             
  agent_policy_id: ""          

steps:
  # ==========================================================================
  # STEP 1: Alert Analyzer Agent — Identify the vulnerability
  # ==========================================================================
  - name: analyze_alert
    type: ai.agent
    with:
      agent_id: "{{ consts.alert_analyzer_id }}"
      message: |
        Alert data:
        {{ inputs.alerts[0] | default: event.alerts[0] | json }}
    timeout: 5m

  # ==========================================================================
  # STEP 2:  Osquery Agent— Generate an osquery to detect the vulnerability
  # ==========================================================================
  - name: generate_osquery
    type: ai.agent
    with:
      agent_id: "{{ consts.osquery_generator_id }}"
      message: |
        Vulnerability analysis:
        {{ steps.analyze_alert.output }}

        Return ONLY the raw SQL query — no markdown, no explanation.
    timeout: 3m

  # ==========================================================================
  # STEP 3: Run the osquery across the full fleet
  # ==========================================================================
  - name: run_fleet_query
    type: kibana.request
    with:
      method: POST
      path: /api/osquery/live_queries
      body:
        query: "{{ steps.generate_osquery.output | remove: '```sql' | remove: '```' | strip }}"
        agent_policy_ids:
          - "{{ consts.agent_policy_id }}"
        timeout: 300

  # Wait for osquery to complete across all agents
  - name: wait_for_osquery
    type: wait
    with:
      duration: 20s

  # Fetch final osquery results
  - name: get_final_results
    type: kibana.request
    with:
      method: GET
      path: "/api/osquery/live_queries/{{ steps.run_fleet_query.output.data.action_id }}"

  # Fetch fleet results from ES index
  - name: fetch_fleet_results
    type: elasticsearch.esql.query
    with:
      format: json
      query: >
        FROM logs-osquery_manager.result-default
        | WHERE action_id == "{{ steps.run_fleet_query.output.data.queries[0].action_id }}"
        | KEEP host.name, osquery.path, action_id, @timestamp

  # ==========================================================================
  # STEP 4: Report Writer Agent — Produce the final report
  # ==========================================================================
  - name: generate_report
    type: ai.agent
    with:
      agent_id: "{{ consts.report_writer_id }}"
      message: |
        Write a security incident report using the template in your instructions.

        SOURCE ALERT DATA:
        {{ inputs.alerts[0] | default: event.alerts[0] | json }}

        VULNERABILITY ANALYSIS:
        {{ steps.analyze_alert.output }}

        OSQUERY USED:
        {{ steps.generate_osquery.output | remove: '```sql' | remove: '```' | strip }}

        FLEET SCAN RESULTS (all monitored hosts):
        Columns: {{ steps.fetch_fleet_results.output.columns | json }}
        Values: {{ steps.fetch_fleet_results.output.values | json }}
    timeout: 5m

  # ==========================================================================
  # STEP 5: Create an Elastic Security Case from the report
  # ==========================================================================
  - name: create_case
    type: kibana.createCaseDefaultSpace
    with:
      owner: securitySolution
      title: "Defend Alert Triage: {{ event.alerts[0]['kibana.alert.rule.name'] | default: inputs.alerts[0]['kibana.alert.rule.name'] }}"
      description: "{{ steps.generate_report.output | strip }}"
      severity: high
      tags:
        - automated
        - alert-triage
        - workflow
      connector:
        id: none
        name: none
        type: .none
        fields: null
      settings:
        syncAlerts: true
